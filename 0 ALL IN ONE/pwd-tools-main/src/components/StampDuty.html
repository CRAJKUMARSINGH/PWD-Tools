<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Stamp Duty Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1em;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        button:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 8px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            color: #2e7d32;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #95a5a6;
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(149, 165, 166, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h2 {
                font-size: 1.5em;
            }
        }
    </style>
    <script>
        function calculateStampDuty() {
            let workOrderAmount = parseFloat(document.getElementById("workOrderAmount").value);
            
            if (isNaN(workOrderAmount) || workOrderAmount < 0) {
                alert("Please enter a valid work order amount");
                return;
            }

            let stampDuty;
            
            if (workOrderAmount <= 5000000) {
                stampDuty = 1000;
            } else {
                stampDuty = Math.round(workOrderAmount * 0.0015);
                if (stampDuty > 2500000) {
                    stampDuty = 2500000;
                }
            }

            const resultElement = document.getElementById("result");
            resultElement.innerHTML = "Stamp Duty: ₹ " + stampDuty.toLocaleString("en-IN");
            resultElement.classList.add("show");
        }

        // Allow Enter key to calculate
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById("workOrderAmount").addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    calculateStampDuty();
                }
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <h2>📜 Stamp Duty Calculator</h2>
        
        <div class="form-group">
            <label for="workOrderAmount">Enter Work Order Amount (₹):</label>
            <input type="number" id="workOrderAmount" min="0" step="1" placeholder="Enter amount">
        </div>

        <button onclick="calculateStampDuty()">
            <span>🧮</span> Calculate Stamp Duty
        </button>

        <div id="result" class="result"></div>

        <a href="../../index.html" class="back-button">
            <span>←</span> Back to Home
        </a>
    </div>
</body>
</html>
